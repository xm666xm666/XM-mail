<VirtualHost *:${APACHE_HTTP_PORT}>
    ServerName _default_
    DocumentRoot /var/www/mail-frontend

    ErrorLog /var/log/httpd/mail-frontend-error.log
    CustomLog /var/log/httpd/mail-frontend-access.log combined

    # ================= 全局代理设置 =================
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60
    Timeout 60

    RewriteEngine On

    # ================= 静态资源 =================
    <Directory /var/www/mail-frontend>
        DirectoryIndex index.html
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # 禁用认证
        AuthType None
        Satisfy Any

        # 压缩
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE \
                text/plain text/html text/xml text/css \
                application/xml application/xhtml+xml \
                application/rss+xml application/javascript \
                application/x-javascript
        </IfModule>

        # 缓存
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpg "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType image/gif "access plus 1 month"
            ExpiresByType image/svg+xml "access plus 1 month"
        </IfModule>
    </Directory>

    # ================= WebSocket =================
    # WebSocket 代理（必须在普通 API 代理之前）
    <IfModule mod_proxy.c>
        <Location /api/terminal/ws>
            # 使用 mod_proxy_wstunnel 处理 WebSocket（Apache 2.4+ 推荐方式）
            <IfModule mod_proxy_wstunnel.c>
                ProxyPass http://127.0.0.1:${API_PORT}/api/terminal/ws upgrade=websocket
                ProxyPassReverse http://127.0.0.1:${API_PORT}/api/terminal/ws
            </IfModule>
            
            # 如果没有 mod_proxy_wstunnel，使用 RewriteRule 回退
            <IfModule !mod_proxy_wstunnel.c>
                RewriteEngine On
                RewriteCond %{HTTP:Upgrade} =websocket [NC]
                RewriteCond %{HTTP:Connection} =upgrade [NC]
                RewriteRule ^/?(.*) ws://127.0.0.1:${API_PORT}/api/terminal/ws/$1 [P,L]
                RewriteCond %{HTTP:Upgrade} !=websocket [NC]
                RewriteRule ^/?(.*) http://127.0.0.1:${API_PORT}/api/terminal/ws/$1 [P,L]
            </IfModule>
            
            Require all granted
            
            # 禁用认证
            AuthType None
            Satisfy Any
        </Location>
    </IfModule>

    # ================= API 代理 =================
    <Location /api/>
        ProxyPass http://127.0.0.1:${API_PORT}/api/
        ProxyPassReverse http://127.0.0.1:${API_PORT}/api/
        Require all granted
        
        # 禁用认证
        AuthType None
        Satisfy Any
    </Location>

    # ================= 上传文件 =================
    <Location /uploads/>
        ProxyPass http://127.0.0.1:${API_PORT}/uploads/
        ProxyPassReverse http://127.0.0.1:${API_PORT}/uploads/
        Require all granted
        
        # 禁用认证
        AuthType None
        Satisfy Any
        
        # 设置缓存头
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000"
        </IfModule>
    </Location>

    # ================= Vue Router =================
    <LocationMatch "^(?!.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)).*$">
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} !^/uploads/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </LocationMatch>

    # ================= 安全头 =================
    <IfModule mod_headers.c>
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-Content-Type-Options nosniff
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>

</VirtualHost>
